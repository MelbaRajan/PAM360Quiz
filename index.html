<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAM360 Build 8540 · Live Quiz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f0ee;color:#1a1a1a;min-height:100vh}
.page{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
.wrap{width:100%;max-width:640px}
.card{background:#fff;border:1px solid #e0e0de;border-radius:14px;padding:1.5rem;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:0.55rem 1.15rem;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;font-family:inherit;transition:background 0.12s,border-color 0.12s}
.btn:hover:not(:disabled){background:#f5f5f3;border-color:#aaa}
.btn:disabled{opacity:0.35;cursor:not-allowed}
.btn-green{background:#1D9E75;border-color:#1D9E75;color:#fff}
.btn-green:hover:not(:disabled){background:#0F6E56;border-color:#0F6E56}
.btn-red{background:#E24B4A;border-color:#E24B4A;color:#fff}
.btn-red:hover:not(:disabled){background:#c03a39;border-color:#c03a39}
.btn-blue{background:#2563EB;border-color:#2563EB;color:#fff}
.btn-blue:hover:not(:disabled){background:#1a4fcf;border-color:#1a4fcf}
input[type=text]{width:100%;padding:0.6rem 0.85rem;border:1px solid #ccc;border-radius:8px;font-size:14px;font-family:inherit;color:#1a1a1a;background:#fff}
input[type=text]:focus{outline:none;border-color:#1D9E75;box-shadow:0 0 0 3px #1D9E7520}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;letter-spacing:0.02em}
.tag-blue{background:#dbeafe;color:#1e40af}
.tag-green{background:#dcfce7;color:#166534}
.tag-orange{background:#ffedd5;color:#9a3412}
.metric{background:#f8f8f6;border:1px solid #e8e8e6;border-radius:10px;padding:0.9rem;text-align:center}
.metric-val{font-size:26px;font-weight:700;color:#1a1a1a;line-height:1}
.metric-lbl{font-size:11px;color:#888;margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em}
.opt{display:block;width:100%;text-align:left;padding:0.8rem 1rem;margin-bottom:8px;border:1.5px solid #e0e0de;border-radius:10px;background:#fafaf8;color:#1a1a1a;font-size:14px;cursor:pointer;font-family:inherit;line-height:1.5;transition:all 0.12s}
.opt:hover:not(:disabled){border-color:#1D9E75;background:#f0faf6}
.opt.picked{border-color:#1D9E75;background:#e6f7f1;color:#064e3b}
.opt.correct{border-color:#16a34a;background:#dcfce7;color:#14532d;font-weight:600}
.opt.wrong{border-color:#dc2626;background:#fee2e2;color:#7f1d1d}
.opt.reveal-correct{border-color:#16a34a;background:#dcfce7;color:#14532d;font-weight:600}
.opt:disabled{cursor:default}
.timer{width:56px;height:56px;border-radius:50%;border:3.5px solid #e0e0de;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0;transition:border-color 0.3s,color 0.3s}
.timer-warn{border-color:#f59e0b;color:#b45309}
.timer-danger{border-color:#ef4444;color:#dc2626}
.prog-bg{height:5px;background:#e0e0de;border-radius:3px;overflow:hidden;margin-bottom:1.1rem}
.prog-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width 0.4s}
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;margin-bottom:5px;background:#f8f8f6;border:1px solid #ececea}
.lb-row.me{background:#e6f7f1;border-color:#1D9E75}
.lb-name{flex:1;font-size:14px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-pts{font-size:13px;font-weight:700;color:#1D9E75;white-space:nowrap}
.lb-bar-bg{width:72px;height:5px;background:#e0e0de;border-radius:3px;overflow:hidden;flex-shrink:0}
.lb-bar-fill{height:100%;background:#1D9E75;border-radius:3px}
.sec{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px}
.hr{border:none;border-top:1px solid #e8e8e6;margin:1rem 0}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 9px;font-size:12px;margin:3px;border:1px solid}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.45}}
.badge-live{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#16a34a;background:#dcfce7;border:1px solid #bbf7d0;border-radius:20px;padding:3px 10px}
.badge-live::before{content:'';width:7px;height:7px;border-radius:50%;background:#16a34a;animation:pulse 1.2s infinite}
@media(max-width:500px){.wrap{max-width:100%}.page{padding:0.75rem}}
</style>
</head>
<body>
<div class="page"><div class="wrap" id="root"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ─── CONFIG ──────────────────────────────────────────────
const Q_TIME = 20;
const ADMIN_PIN = '1234';
const QUESTIONS = [
  {
    topic:"Ephemeral Accounts",
    q:"What is the primary security benefit of PAM360's Ephemeral Account Provisioning?",
    opts:["Encrypts existing privileged accounts using AES-256","Eliminates persistent privileged accounts with time-bound, on-demand accounts","Allows bulk import of service accounts from Active Directory","Enables MFA for all privileged users"],
    answer:1,
    explain:"Ephemeral accounts are time-bound and provisioned on demand — they are automatically deprovisioned after use, eliminating persistent accounts and reducing credential misuse via just-in-time access."
  },
  {
    topic:"Ephemeral Accounts",
    q:"Which access principle does Ephemeral Account Provisioning implement to reduce credential misuse?",
    opts:["Zero-trust network access","Separation of duties","Just-in-time (JIT) access","Least privilege enforcement"],
    answer:2,
    explain:"Just-in-time (JIT) access means accounts are only created when needed and automatically removed after the session ends."
  },
  {
    topic:"AI Integration",
    q:"Which AI platform is NOT listed among PAM360's newly supported cloud AI integrations?",
    opts:["Microsoft Azure OpenAI Service","DeepSeek","IBM Watson","Anthropic"],
    answer:2,
    explain:"PAM360 now supports Microsoft Azure OpenAI Service, Anthropic, Google AI, DeepSeek, and SiliconFlow. IBM Watson is not included."
  },
  {
    topic:"AI Integration",
    q:"What two capabilities benefit most from PAM360's expanded cloud AI integrations?",
    opts:["Password rotation and credential discovery","Session analysis and CIEM policy recommendations","Threat intelligence and vulnerability scanning","User provisioning and access certification"],
    answer:1,
    explain:"The AI integrations are specifically used for session analysis and Cloud Infrastructure Entitlement Management (CIEM) policy recommendations."
  },
  {
    topic:"AI Integration",
    q:"Does PAM360 support connecting to self-hosted / local LLMs over HTTP?",
    opts:["Yes — both HTTP and HTTPS are supported","Yes — HTTP is allowed for internal network LLMs","No — PAM360 only supports HTTPS connections, even for local LLMs","No — PAM360 does not support self-hosted LLMs at all"],
    answer:2,
    explain:"PAM360 supports self-hosted LLMs (Phi-3, Mistral, LLaMA, Qwen etc.) but requires HTTPS connections only — HTTP is not supported."
  },
  {
    topic:"Session Management",
    q:"What does the new remote audio input redirection in RDP sessions allow users to do?",
    opts:["Record remote machine audio to a local file","Use their local microphone as an input device inside the remote machine","Stream audio from the remote machine to local speakers","Enable text-to-speech during SSH sessions"],
    answer:1,
    explain:"Remote audio input redirection lets users use their local microphone as an input device within the remote RDP machine — it's input, not output."
  },
  {
    topic:"Session Management",
    q:"What is the primary purpose of the new role-based privilege to control deletion of session recordings?",
    opts:["Reduce storage costs by automating old recording deletion","Allow end-users to manage their own session history","Strengthen audit integrity and compliance by restricting who can delete recordings","Enable real-time monitoring of active RDP sessions"],
    answer:2,
    explain:"Administrators can restrict users from deleting recorded sessions, which strengthens audit integrity and compliance."
  },
  {
    topic:"Security Enhancement",
    q:"Why was the Cewolf library removed from PAM360, and what is the impact?",
    opts:["It caused performance issues — dashboards now load faster","It reached End-of-Life (EOL) status; visual charts are removed from reports but all data remains available","It was replaced by a newer charting library with better visuals","It conflicted with the JasperReports upgrade and both were removed"],
    answer:1,
    explain:"Cewolf was removed due to EOL status and security compliance requirements. Reports no longer show visual charts, but all underlying report data is still accessible."
  },
  {
    topic:"Remote Connect",
    q:"In PAM360 Remote Connect 5.1, which credentials can now be used to initiate RDP and SSH connections?",
    opts:["API tokens and service account passwords","Certificate-based credentials only","The user's logged-in AD / Entra ID / LDAP credentials","One-time passwords generated by PAM360"],
    answer:2,
    explain:"Remote Connect 5.1 lets users initiate RDP and SSH connections using their currently logged-in AD, Entra ID, or LDAP credentials."
  },
  {
    topic:"Remote Connect",
    q:"In SSH proxy environments, what must a user provide to connect to resources requiring ticket ID-based approval?",
    opts:["A biometric verification token","A valid ticket ID","A one-time password from their authenticator app","An admin-approved session certificate"],
    answer:1,
    explain:"Users can now initiate remote connections to resources requiring ticket ID-based approval by providing a valid ticket ID during the connection."
  }
];

const COLORS=['#3B82F6','#EF4444','#10B981','#8B5CF6','#F59E0B','#EC4899','#06B6D4','#F97316','#6366F1','#14B8A6','#84CC16','#E11D48'];

// ─── STATE ───────────────────────────────────────────────
let G = {
  view: 'landing',
  role: null,
  pin: '',
  // Game
  phase: 'lobby',   // lobby | question | reveal | leaderboard | finished
  currentQ: -1,
  players: {},      // { name: { score, answers:{qIdx:{choice,correct,pts,time}}, color } }
  timerVal: Q_TIME,
  timerInterval: null,
  // Admin join flow
  joinName: '',
  // Participant join flow
  nickname: '',
  myAnswers: {},    // { qIdx: choiceIndex }
  // QR
  joinUrl: window.location.href
};

// ─── HELPERS ─────────────────────────────────────────────
function gc(n){let h=0;for(let c of n)h=(h*37+c.charCodeAt(0))%COLORS.length;return COLORS[h]}
function ini(n){return n.trim().split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?'}
function av(name,sz,fs,extra=''){
  return`<div class="av" style="width:${sz}px;height:${sz}px;min-width:${sz}px;background:${gc(name)};font-size:${fs}px${extra?';'+extra:''}">${ini(name)}</div>`
}
function lbData(){
  return Object.entries(G.players).sort((a,b)=>b[1].score-a[1].score).map(([n,d],i)=>({rank:i+1,name:n,...d}));
}
function set(h){document.getElementById('root').innerHTML=h}
function go(v){G.view=v;render()}

// ─── TIMER ───────────────────────────────────────────────
function startTimer(onZero){
  clearInterval(G.timerInterval);
  G.timerVal = Q_TIME;
  G.timerInterval = setInterval(()=>{
    G.timerVal--;
    refreshTimerEl();
    if(G.timerVal<=0){clearInterval(G.timerInterval);onZero&&onZero();}
  },1000);
}
function stopTimer(){clearInterval(G.timerInterval);}
function refreshTimerEl(){
  const el=document.getElementById('timer-el');
  if(!el)return;
  el.textContent=G.timerVal;
  el.className=`timer${G.timerVal<=5?' timer-danger':G.timerVal<=10?' timer-warn':''}`;
}

// ─── RENDER DISPATCH ─────────────────────────────────────
function render(){
  ({
    landing:rLanding, adminPin:rAdminPin, qr:rQR,
    adminLobby:rAdminLobby, adminQuestion:rAdminQuestion,
    adminReveal:rAdminReveal, adminLeaderboard:rAdminLB, adminFinished:rAdminFinished,
    join:rJoin, lobby:rLobby, question:rQuestion,
    reveal:rReveal, leaderboard:rLB, finished:rFinished
  }[G.view]||rLanding)();
}

// ─────────────────────────────────────────────────────────
// LANDING
// ─────────────────────────────────────────────────────────
function rLanding(){
  set(`<div style="text-align:center;padding:2.5rem 1rem 2rem">
    <div style="font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px">ManageEngine PAM360</div>
    <h1 style="font-size:26px;font-weight:700;margin-bottom:6px">Build 8540 · Live Quiz</h1>
    <p style="font-size:14px;color:#666;margin-bottom:2rem">${QUESTIONS.length} questions &nbsp;·&nbsp; ${Q_TIME}s timer &nbsp;·&nbsp; live leaderboard</p>
    <div style="display:flex;flex-direction:column;gap:10px;max-width:272px;margin:0 auto">
      <button class="btn btn-green" style="justify-content:center;padding:0.8rem;font-size:15px;font-weight:600" onclick="go('join')">&#128100;&nbsp; Join as participant</button>
      <button class="btn btn-blue" style="justify-content:center;padding:0.8rem;font-weight:600" onclick="go('adminPin')">&#9881;&nbsp; Host / Admin panel</button>
      <button class="btn" style="justify-content:center;padding:0.8rem" onclick="go('qr')">&#9638;&nbsp; Show join QR code</button>
    </div>
    <p style="font-size:12px;color:#bbb;margin-top:1.75rem">Admin PIN: <strong style="color:#888">1234</strong></p>
  </div>`);
}

// ─────────────────────────────────────────────────────────
// ADMIN PIN
// ─────────────────────────────────────────────────────────
function rAdminPin(){
  set(`<div style="max-width:320px;margin:2.5rem auto">
    <div class="card">
      <p style="font-size:16px;font-weight:700;margin-bottom:4px">Admin access</p>
      <p style="font-size:13px;color:#888;margin-bottom:1rem">Enter the host PIN to manage the quiz.</p>
      <input type="text" id="pin" placeholder="Enter PIN" maxlength="8" style="margin-bottom:8px" />
      <div id="pin-err" style="font-size:12px;color:#dc2626;min-height:16px;margin-bottom:8px"></div>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="go('landing')">&#8592; Back</button>
        <button class="btn btn-blue" onclick="doPin()">Enter &rarr;</button>
      </div>
    </div>
  </div>`);
  const el=document.getElementById('pin');
  el.focus();
  el.addEventListener('keydown',e=>{if(e.key==='Enter')doPin();});
}
function doPin(){
  if(document.getElementById('pin').value===ADMIN_PIN){G.role='admin';go('adminLobby');}
  else document.getElementById('pin-err').textContent='Incorrect PIN. Try again.';
}

// ─────────────────────────────────────────────────────────
// QR PAGE
// ─────────────────────────────────────────────────────────
function rQR(){
  set(`<div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem">
      <button class="btn" onclick="go('landing')" style="padding:0.4rem 0.8rem">&#8592;</button>
      <h2 style="font-size:20px;font-weight:700">Join QR code</h2>
    </div>
    <div class="card" style="display:flex;gap:1.5rem;flex-wrap:wrap;align-items:flex-start">
      <div>
        <div style="background:#fff;padding:10px;border-radius:10px;border:1px solid #e0e0de;display:inline-block" id="qr-el"></div>
        <p style="font-size:11px;color:#aaa;text-align:center;margin-top:6px">Scan to join</p>
      </div>
      <div style="flex:1;min-width:190px">
        <p class="sec">Quiz URL</p>
        <input type="text" id="qr-url" value="${G.joinUrl}" style="margin-bottom:8px;font-size:13px" />
        <button class="btn btn-green" onclick="updateQR()" style="width:100%;justify-content:center;margin-bottom:1rem">&#8635; Update QR</button>
        <div class="hr"></div>
        <p class="sec">How to join</p>
        <p style="font-size:13px;color:#555;line-height:1.85">Participants open the URL on any device, tap <strong>"Join as participant"</strong>, enter their nickname — they appear in the lobby instantly.</p>
      </div>
    </div>
    <div style="margin-top:1rem;display:flex;gap:8px">
      <button class="btn btn-blue" onclick="go('adminPin')">&#9881; Host panel</button>
      <button class="btn" onclick="go('join')">&#128100; Join</button>
    </div>
  </div>`);
  setTimeout(()=>doQR(G.joinUrl),80);
}
function doQR(url){
  const el=document.getElementById('qr-el');
  if(!el)return;
  el.innerHTML='';
  try{new QRCode(el,{text:url,width:160,height:160,colorDark:'#111',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});}
  catch(e){el.innerHTML='<div style="width:160px;height:160px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#888;text-align:center;padding:1rem">Paste URL &amp; click Update QR</div>';}
}
function updateQR(){
  const v=document.getElementById('qr-url')?.value?.trim();
  if(v){G.joinUrl=v;doQR(v);}
}

// ─────────────────────────────────────────────────────────
// ADMIN LOBBY
// ─────────────────────────────────────────────────────────
function rAdminLobby(){
  const count=Object.keys(G.players).length;
  set(`<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem">
      <div>
        <h2 style="font-size:20px;font-weight:700">Host panel</h2>
        <div style="margin-top:4px"><span class="badge-live">Lobby open</span></div>
      </div>
      <button class="btn" onclick="go('qr')" style="font-size:12px">&#9638; QR</button>
    </div>

    <div class="card" style="margin-bottom:1rem">
      <p class="sec">Add participant manually</p>
      <div style="display:flex;gap:8px">
        <input type="text" id="add-name" placeholder="Type nickname and press Enter" maxlength="20" style="flex:1" />
        <button class="btn btn-green" onclick="adminAddPlayer()">+ Add</button>
      </div>
      <div id="add-err" style="font-size:12px;color:#dc2626;min-height:14px;margin-top:4px"></div>
    </div>

    <div class="card" style="margin-bottom:1rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <p class="sec" style="margin-bottom:0">Players in lobby (${count})</p>
        <button class="btn" onclick="adminAddDemo()" style="font-size:11px;padding:3px 8px">+ Demo players</button>
      </div>
      <div id="player-list" style="display:flex;flex-wrap:wrap;gap:4px;min-height:28px">
        ${count===0
          ? '<p style="font-size:13px;color:#bbb;padding:4px 0">No players yet — add manually or share the link/QR.</p>'
          : renderChips()}
      </div>
    </div>

    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-green" style="font-size:15px;font-weight:600;padding:0.7rem 1.5rem" onclick="adminStart()" ${count===0?'disabled':''}>
        &#9654;&nbsp; Start quiz${count>0?' ('+count+' player'+(count!==1?'s':'')+')':''}
      </button>
      ${count===0?'<span style="font-size:12px;color:#aaa">Add at least one player to start</span>':''}
    </div>
  </div>`);
  const inp=document.getElementById('add-name');
  inp.focus();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')adminAddPlayer();});
}

function renderChips(){
  return Object.keys(G.players).map(name=>`
    <div class="chip" style="background:${gc(name)}18;border-color:${gc(name)}55;color:#333">
      ${av(name,16,8,'vertical-align:middle')}
      <span style="margin-left:3px">${name}</span>
      <span onclick="removePlayer('${name}')" style="margin-left:4px;cursor:pointer;color:#aaa;font-size:14px;line-height:1" title="Remove">&#215;</span>
    </div>`).join('');
}

function adminAddPlayer(){
  const inp=document.getElementById('add-name');
  const name=inp.value.trim();
  const err=document.getElementById('add-err');
  if(!name){err.textContent='Enter a nickname.';return;}
  if(name.length<2){err.textContent='At least 2 characters.';return;}
  if(G.players[name]){err.textContent=`"${name}" is already in the lobby.`;return;}
  G.players[name]={score:0,answers:{},color:gc(name)};
  err.textContent='';
  inp.value='';
  inp.focus();
  rAdminLobby();
}

function removePlayer(name){
  delete G.players[name];
  rAdminLobby();
}

function adminAddDemo(){
  ['Priya_K','DevOps_Sam','SecLead_Jo','CloudArch','SysAdmin99','PenTester','NetOps_Al','IAM_Expert','Infra_Dan','ReleaseBot'].forEach(n=>{
    if(!G.players[n])G.players[n]={score:0,answers:{},color:gc(n)};
  });
  rAdminLobby();
}

function adminStart(){
  if(Object.keys(G.players).length===0)return;
  G.phase='question';
  G.currentQ=0;
  go('adminQuestion');
  startTimer(()=>{stopTimer();go('adminReveal');});
}

// ─────────────────────────────────────────────────────────
// ADMIN QUESTION
// ─────────────────────────────────────────────────────────
function rAdminQuestion(){
  const q=QUESTIONS[G.currentQ];
  const count=Object.keys(G.players).length;
  set(`<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.85rem">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="tag tag-blue">${q.topic}</span>
        <span style="font-size:12px;color:#888;font-weight:500">Q${G.currentQ+1} / ${QUESTIONS.length}</span>
      </div>
      <div class="timer${G.timerVal<=5?' timer-danger':G.timerVal<=10?' timer-warn':''}" id="timer-el">${G.timerVal}</div>
    </div>
    <div class="prog-bg"><div class="prog-fill" style="width:${Math.round(G.currentQ/QUESTIONS.length*100)}%"></div></div>
    <div class="card" style="margin-bottom:1rem">
      <p style="font-size:17px;font-weight:700;line-height:1.5;margin-bottom:1.1rem">${q.q}</p>
      ${q.opts.map((o,i)=>`<button class="opt" disabled style="opacity:0.85">
        <span style="font-weight:700;color:#aaa;margin-right:8px">${String.fromCharCode(65+i)}.</span>${o}
      </button>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem">
      <div class="metric"><div class="metric-val">${count}</div><div class="metric-lbl">Players</div></div>
      <div class="metric"><div class="metric-val">${Q_TIME}s</div><div class="metric-lbl">Timer</div></div>
      <div class="metric"><div class="metric-val">${G.currentQ+1}/${QUESTIONS.length}</div><div class="metric-lbl">Progress</div></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-green" onclick="adminReveal()">&#128065;&nbsp; Reveal answer</button>

function adminNext(){
  if(G.currentQ+1>=QUESTIONS.length){adminEnd();return;}
  G.currentQ++;
  G.phase='question';
  go('adminQuestion');
  startTimer(()=>{stopTimer();go('adminReveal');});
}

function adminReset(){
  stopTimer();
  G.players={};G.currentQ=-1;G.phase='lobby';G.timerVal=Q_TIME;
  go('adminLobby');
}

// ─────────────────────────────────────────────────────────
// PARTICIPANT JOIN
// ─────────────────────────────────────────────────────────
function rJoin(){
  set(`<div style="max-width:380px;margin:2rem auto">
    <div class="card">
      <div style="text-align:center;margin-bottom:1.25rem">
        <div style="font-size:44px;margin-bottom:8px">&#128100;</div>
        <h2 style="font-size:18px;font-weight:700;margin-bottom:4px">Enter your nickname</h2>
        <p style="font-size:13px;color:#888">This is how you'll appear on the leaderboard.</p>
      </div>
      <input type="text" id="nick" placeholder="e.g. Alex_Dev" maxlength="20" style="margin-bottom:8px;font-size:16px;text-align:center" />
      <div id="nick-err" style="font-size:12px;color:#dc2626;min-height:16px;text-align:center;margin-bottom:8px"></div>
      <button class="btn btn-green" onclick="doJoin()" style="width:100%;justify-content:center;padding:0.8rem;font-size:15px;font-weight:600">Join quiz &rarr;</button>
      <button class="btn" onclick="go('landing')" style="width:100%;justify-content:center;margin-top:8px">&#8592; Back</button>
    </div>
  </div>`);
  const el=document.getElementById('nick');
  el.focus();
  el.addEventListener('keydown',e=>{if(e.key==='Enter')doJoin();});
}

function doJoin(){
  const name=document.getElementById('nick').value.trim();
  const err=document.getElementById('nick-err');
  if(!name){err.textContent='Please enter a nickname.';return;}
  if(name.length<2){err.textContent='At least 2 characters.';return;}
  if(G.players[name]){err.textContent='That nickname is already taken.';return;}
  // Register in game
  G.players[name]={score:0,answers:{},color:gc(name)};
  G.nickname=name;
  G.role='player';
  G.myAnswers={};
  // Go to correct view based on game phase
  if(G.phase==='lobby') go('lobby');
  else if(G.phase==='question') go('question');
  else if(G.phase==='reveal') go('reveal');
  else if(G.phase==='finished') go('finished');
  else go('lobby');
}

// ─────────────────────────────────────────────────────────
// PARTICIPANT LOBBY
// ─────────────────────────────────────────────────────────
function rLobby(){
  const count=Object.keys(G.players).length;
  set(`<div style="text-align:center;padding:2rem 0.5rem">
    <div style="font-size:13px;color:#aaa;margin-bottom:0.5rem">Waiting for host to start...</div>
    <h2 style="font-size:22px;font-weight:700;margin-bottom:4px">PAM360 Build 8540 Quiz</h2>
    <p style="font-size:13px;color:#777;margin-bottom:1.5rem">${QUESTIONS.length} questions &nbsp;·&nbsp; ${Q_TIME}s each</p>
    <div style="width:76px;height:76px;border-radius:50%;background:${gc(G.nickname)};display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;margin:0 auto 0.75rem">${ini(G.nickname)}</div>
    <p style="font-size:18px;font-weight:700;margin-bottom:4px">${G.nickname}</p>

    <div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:420px;margin:0 auto">
      ${Object.keys(G.players).map(n=>`
        <div class="chip" style="background:${gc(n)}18;border-color:${gc(n)}55">
          ${av(n,16,8,'vertical-align:middle')}
          <span style="margin-left:3px;color:#333">${n}</span>
        </div>`).join('')}
    </div>
  </div>`);
}

// ─────────────────────────────────────────────────────────
// PARTICIPANT QUESTION
// ─────────────────────────────────────────────────────────
function rQuestion(){
  const q=QUESTIONS[G.currentQ];
  const picked=G.myAnswers[G.currentQ];
  const answered=picked!==undefined;
  set(`<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.85rem">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="tag tag-blue">${q.topic}</span>
        <span style="font-size:12px;color:#888">Q${G.currentQ+1}/${QUESTIONS.length}</span>
      </div>
      <div class="timer${G.timerVal<=5?' timer-danger':G.timerVal<=10?' timer-warn':''}" id="timer-el">${G.timerVal}</div>
    </div>
    <div class="prog-bg"><div class="prog-fill" style="width:${Math.round(G.currentQ/QUESTIONS.length*100)}%"></div></div>
    <p style="font-size:16px;font-weight:700;margin-bottom:1.1rem;line-height:1.55">${q.q}</p>
    ${q.opts.map((o,i)=>`
      <button class="opt${answered&&i===picked?' picked':''}" ${answered?'disabled':''} onclick="playerAnswer(${i})">
        <span style="font-weight:700;color:#bbb;margin-right:8px">${String.fromCharCode(65+i)}.</span>${o}
      </button>`).join('')}
    ${answered
      ?`<div style="margin-top:1rem;padding:0.75rem 1rem;background:#e6f7f1;border:1px solid #6ee7b7;border-radius:9px;font-size:13px;color:#065f46;text-align:center">
          &#10003;&nbsp; Answer locked in — waiting for host to reveal
        </div>`
      :''}
  </div>`);
}

function playerAnswer(i){
  if(G.myAnswers[G.currentQ]!==undefined)return;
  G.myAnswers[G.currentQ]=i;
  const q=QUESTIONS[G.currentQ];
  const correct=i===q.answer;
  const timeTaken=Q_TIME-G.timerVal;
  const pts=correct?Math.max(50,Math.round(500-timeTaken*42)):0;
  if(G.players[G.nickname]){
    G.players[G.nickname].answers[G.currentQ]={choice:i,correct,pts,time:timeTaken};
    G.players[G.nickname].score=(G.players[G.nickname].score||0)+pts;
  }
  render();
}

// ─────────────────────────────────────────────────────────
// PARTICIPANT REVEAL
// ─────────────────────────────────────────────────────────
function rReveal(){
  const q=QUESTIONS[G.currentQ];
  const myAns=G.players[G.nickname]?.answers?.[G.currentQ];
  const picked=G.myAnswers[G.currentQ];
  const correct=myAns?.correct||false;
  set(`<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.85rem">
      <span class="tag tag-orange">Answer revealed</span>
      <span style="font-size:12px;color:#888">Q${G.currentQ+1}/${QUESTIONS.length}</span>
    </div>
    <p style="font-size:16px;font-weight:700;margin-bottom:1rem;line-height:1.55">${q.q}</p>
    ${q.opts.map((o,i)=>`
      <button class="opt ${i===q.answer?'reveal-correct':picked===i&&!correct?'wrong':''}" disabled>
        <span style="font-weight:700;color:${i===q.answer?'#14532d':'#bbb'};margin-right:8px">${String.fromCharCode(65+i)}.</span>${o}
        ${i===q.answer?' &#10003;':''}
      </button>`).join('')}
    ${myAns
      ?`<div style="margin-top:1rem;padding:0.8rem 1rem;border-radius:9px;font-size:14px;font-weight:500;
          background:${correct?'#dcfce7':'#fee2e2'};color:${correct?'#14532d':'#7f1d1d'};
          border:1px solid ${correct?'#86efac':'#fca5a5'}">
          ${correct?`&#9989;&nbsp; Correct! +${myAns.pts} pts &nbsp;·&nbsp; answered in ${myAns.time.toFixed(1)}s`
            :`&#10060;&nbsp; Incorrect. Correct answer: <strong>${String.fromCharCode(65+q.answer)}. ${q.opts[q.answer]}</strong>`}
        </div>`
      :`<div style="margin-top:1rem;padding:0.8rem 1rem;background:#f5f5f3;border-radius:9px;font-size:13px;color:#888">Time ran out — no answer recorded.</div>`}
    <div style="margin-top:0.75rem;padding:0.7rem 0.9rem;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;font-size:13px;color:#14532d;line-height:1.55">
      &#128161;&nbsp;<strong>Why?</strong> ${q.explain}
    </div>
    <p style="font-size:13px;color:#aaa;margin-top:1rem;text-align:center" class="pulse">Waiting for host to continue...</p>
  </div>`);
}

          <div style="font-size:15px;font-weight:700">${p.name}${p.name===G.nickname?' <span style="font-size:11px;color:#1D9E75">(you)</span>':''}</div>
