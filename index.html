<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAM360 Build 8540 · Live Quiz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f0ee;color:#1a1a1a;min-height:100vh}
.page{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
.wrap{width:100%;max-width:620px}
.card{background:#fff;border:1px solid #e0e0de;border-radius:14px;padding:1.5rem;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:0.55rem 1.15rem;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;font-family:inherit;transition:background 0.12s,border-color 0.12s}
.btn:hover:not(:disabled){background:#f0f0ee;border-color:#aaa}
.btn:disabled{opacity:0.38;cursor:not-allowed}
.btn-green{background:#1D9E75;border-color:#1D9E75;color:#fff}
.btn-green:hover:not(:disabled){background:#0F6E56;border-color:#0F6E56}
.btn-red{background:#E24B4A;border-color:#E24B4A;color:#fff}
.btn-red:hover:not(:disabled){background:#c03a39}
.btn-blue{background:#2563EB;border-color:#2563EB;color:#fff}
.btn-blue:hover:not(:disabled){background:#1a4fcf}
input[type=text]{width:100%;padding:0.6rem 0.85rem;border:1px solid #ccc;border-radius:8px;font-size:14px;font-family:inherit;color:#1a1a1a;background:#fff}
input[type=text]:focus{outline:none;border-color:#1D9E75;box-shadow:0 0 0 3px #1D9E7520}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
.tag-blue{background:#dbeafe;color:#1e40af}
.tag-orange{background:#ffedd5;color:#9a3412}
.tag-green{background:#dcfce7;color:#166534}
.metric{background:#f8f8f6;border:1px solid #e8e8e6;border-radius:10px;padding:0.9rem;text-align:center}
.metric-val{font-size:26px;font-weight:700;color:#1a1a1a;line-height:1}
.metric-lbl{font-size:11px;color:#888;margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em}
.opt{display:block;width:100%;text-align:left;padding:0.8rem 1rem;margin-bottom:8px;border:1.5px solid #e0e0de;border-radius:10px;background:#fafaf8;color:#1a1a1a;font-size:14px;cursor:pointer;font-family:inherit;line-height:1.5;transition:all 0.12s}
.opt:hover:not(:disabled){border-color:#1D9E75;background:#f0faf6}
.opt.picked{border-color:#1D9E75;background:#e6f7f1;color:#064e3b}
.opt.correct{border-color:#16a34a;background:#dcfce7;color:#14532d;font-weight:600}
.opt.wrong{border-color:#dc2626;background:#fee2e2;color:#7f1d1d}
.opt:disabled{cursor:default}
.timer{width:56px;height:56px;border-radius:50%;border:3.5px solid #e0e0de;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0;transition:border-color 0.3s,color 0.3s}
.timer-warn{border-color:#f59e0b!important;color:#b45309!important}
.timer-danger{border-color:#ef4444!important;color:#dc2626!important}
.prog-bg{height:5px;background:#e0e0de;border-radius:3px;overflow:hidden;margin-bottom:1.1rem}
.prog-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width 0.4s}
.lb-row{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;margin-bottom:5px;background:#f8f8f6;border:1px solid #ececea}
.lb-row.me{background:#e6f7f1;border-color:#1D9E75}
.lb-name{flex:1;font-size:14px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-pts{font-size:13px;font-weight:700;color:#1D9E75;white-space:nowrap}
.lb-stat{font-size:11px;color:#888;white-space:nowrap;flex-shrink:0}
.lb-bar-bg{width:60px;height:5px;background:#e0e0de;border-radius:3px;overflow:hidden;flex-shrink:0}
.lb-bar-fill{height:100%;background:#1D9E75;border-radius:3px}
.sec{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px}
.hr{border:none;border-top:1px solid #e8e8e6;margin:1rem 0}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 9px;font-size:12px;margin:3px;border:1px solid}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.badge-live{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#16a34a;background:#dcfce7;border:1px solid #bbf7d0;border-radius:20px;padding:3px 10px}
.badge-live::before{content:'';width:7px;height:7px;border-radius:50%;background:#16a34a;animation:pulse 1.2s infinite}
.notice{padding:0.75rem 1rem;border-radius:9px;font-size:13px;line-height:1.55}
.notice-blue{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.notice-green{background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d}
.notice-red{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
@media(max-width:500px){.wrap{max-width:100%}.page{padding:0.75rem}}
</style>
</head>
<body>
<div class="page"><div class="wrap" id="root"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ════════════════════════════════════════════════════════
//  HOW MULTIPLAYER WORKS
//  We use JSONBin.io as a free shared state store.
//  The HOST creates a bin (gets a BIN_ID), shares the URL
//  with that BIN_ID as a query param so all devices read/
//  write the same game state.
//  URL format: https://yoursite.com/?bin=BIN_ID&role=player
// ════════════════════════════════════════════════════════

const JSONBIN_BASE = 'https://api.jsonbin.io/v3';
const JSONBIN_KEY  = '$2a$10$placeholder'; // replaced at bin-create time with real key
const Q_TIME = 20;
const POLL_MS = 2000;
const ADMIN_PIN = '1234';

const COLORS=['#3B82F6','#EF4444','#10B981','#8B5CF6','#F59E0B','#EC4899','#06B6D4','#F97316','#6366F1','#14B8A6','#84CC16','#E11D48'];

const QUESTIONS=[
  {topic:"Ephemeral Accounts",q:"What is the primary security benefit of PAM360's Ephemeral Account Provisioning?",opts:["Encrypts existing privileged accounts using AES-256","Eliminates persistent privileged accounts with time-bound, on-demand accounts","Allows bulk import of service accounts from Active Directory","Enables MFA for all privileged users"],answer:1,explain:"Ephemeral accounts are time-bound and provisioned on demand — automatically deprovisioned after use, eliminating persistent accounts and reducing credential misuse via just-in-time access."},
  {topic:"Ephemeral Accounts",q:"Which access principle does Ephemeral Account Provisioning implement to reduce credential misuse?",opts:["Zero-trust network access","Separation of duties","Just-in-time (JIT) access","Least privilege enforcement"],answer:2,explain:"Just-in-time (JIT) access means accounts are only created when needed and automatically removed after the session ends."},
  {topic:"AI Integration",q:"Which AI platform is NOT listed among PAM360's newly supported cloud AI integrations?",opts:["Microsoft Azure OpenAI Service","DeepSeek","IBM Watson","Anthropic"],answer:2,explain:"PAM360 now supports Microsoft Azure OpenAI Service, Anthropic, Google AI, DeepSeek, and SiliconFlow. IBM Watson is not included."},
  {topic:"AI Integration",q:"What two capabilities benefit most from PAM360's expanded cloud AI integrations?",opts:["Password rotation and credential discovery","Session analysis and CIEM policy recommendations","Threat intelligence and vulnerability scanning","User provisioning and access certification"],answer:1,explain:"The AI integrations are specifically used for session analysis and Cloud Infrastructure Entitlement Management (CIEM) policy recommendations."},
  {topic:"AI Integration",q:"Does PAM360 support connecting to self-hosted / local LLMs over HTTP?",opts:["Yes — both HTTP and HTTPS are supported","Yes — HTTP is allowed for internal network LLMs","No — PAM360 only supports HTTPS connections, even for local LLMs","No — PAM360 does not support self-hosted LLMs at all"],answer:2,explain:"PAM360 supports self-hosted LLMs (Phi-3, Mistral, LLaMA, Qwen etc.) but requires HTTPS connections only — HTTP is not supported."},
  {topic:"Session Management",q:"What does the new remote audio input redirection in RDP sessions allow users to do?",opts:["Record remote machine audio to a local file","Use their local microphone as an input device inside the remote machine","Stream audio from the remote machine to local speakers","Enable text-to-speech during SSH sessions"],answer:1,explain:"Remote audio input redirection lets users use their local microphone as an input device within the remote RDP machine."},
  {topic:"Session Management",q:"What is the primary purpose of the new role-based privilege to control deletion of session recordings?",opts:["Reduce storage costs by automating old recording deletion","Allow end-users to manage their own session history","Strengthen audit integrity and compliance by restricting who can delete recordings","Enable real-time monitoring of active RDP sessions"],answer:2,explain:"Administrators can restrict users from deleting recorded sessions, which strengthens audit integrity and compliance."},
  {topic:"Security Enhancement",q:"Why was the Cewolf library removed from PAM360, and what is the impact?",opts:["It caused performance issues — dashboards now load faster","It reached End-of-Life (EOL); visual charts are removed from reports but all data remains available","It was replaced by a newer charting library with better visuals","It conflicted with the JasperReports upgrade"],answer:1,explain:"Cewolf was removed due to EOL status and security compliance. Reports no longer show visual charts, but all underlying data is still accessible."},
  {topic:"Remote Connect",q:"In PAM360 Remote Connect 5.1, which credentials can now be used to initiate RDP and SSH connections?",opts:["API tokens and service account passwords","Certificate-based credentials only","The user's logged-in AD / Entra ID / LDAP credentials","One-time passwords generated by PAM360"],answer:2,explain:"Remote Connect 5.1 lets users initiate RDP and SSH connections using their currently logged-in AD, Entra ID, or LDAP credentials."},
  {topic:"Remote Connect",q:"In SSH proxy environments, what must a user provide to connect to resources requiring ticket ID-based approval?",opts:["A biometric verification token","A valid ticket ID","A one-time password from their authenticator app","An admin-approved session certificate"],answer:1,explain:"Users can now initiate remote connections to resources requiring ticket ID-based approval by providing a valid ticket ID."}
];

// ── helpers ──────────────────────────────────────────────
function gc(n){let h=0;for(let c of n)h=(h*37+c.charCodeAt(0))%COLORS.length;return COLORS[h]}
function ini(n){return(n||'?').trim().split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?'}
function av(name,sz,fs){return`<div class="av" style="width:${sz}px;height:${sz}px;min-width:${sz}px;background:${gc(name)};font-size:${fs}px">${ini(name)}</div>`}
function set(h){document.getElementById('root').innerHTML=h}
function go(v){V=v;render()}
function qs(k){return new URLSearchParams(location.search).get(k)||''}
function lbRows(players){
  return Object.entries(players||{})
    .sort((a,b)=>b[1].score-a[1].score)
    .map(([n,d],i)=>{
      const answered=Object.keys(d.answers||{}).length;
      const correct=Object.values(d.answers||{}).filter(a=>a.correct).length;
      return{rank:i+1,name:n,answered,correct,...d};
    });
}

// ── state ────────────────────────────────────────────────
let V='landing';          // current view
let BIN_ID=qs('bin');     // JSONBin bin ID (shared across devices)
let ROLE=qs('role');      // 'player' if URL has ?role=player
let MY_NAME='';           // this participant's nickname
let MY_ANSWERS={};        // local answers {qIdx: choiceIdx}
let pollTimer=null;
let timerInterval=null;
let timerVal=Q_TIME;
let lastPhase='';
let lastQ=-1;
let GS=null;              // latest game state from server

// default game state shape
function freshState(){
  return{phase:'lobby',currentQ:-1,timerStart:null,players:{},rev:0};
}

// ── JSONBin API ───────────────────────────────────────────
async function binCreate(){
  // Creates a new bin with fresh state; returns bin ID
  const r=await fetch(`${JSONBIN_BASE}/b`,{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Bin-Private':'false'},
    body:JSON.stringify(freshState())
  });
  const j=await r.json();
  return j.metadata?.id||null;
}

async function binRead(id){
  const r=await fetch(`${JSONBIN_BASE}/b/${id}/latest`,{cache:'no-store'});
  const j=await r.json();
  return j.record||null;
}

async function binWrite(id,data){
  await fetch(`${JSONBIN_BASE}/b/${id}`,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
  });
}

// ── polling ───────────────────────────────────────────────
function startPoll(){
  stopPoll();
  pollTimer=setInterval(async()=>{
    if(!BIN_ID)return;
    try{
      const s=await binRead(BIN_ID);
      if(!s)return;
      GS=s;
      syncView(s);
    }catch(e){}
  },POLL_MS);
}

function stopPoll(){clearInterval(pollTimer);pollTimer=null;}

function syncView(s){
  // participant view follows server phase
  if(ROLE==='player'){
    const phase=s.phase;
    if(phase==='lobby'&&V!=='lobby'){go('lobby');return;}
    if(phase==='question'&&(V==='lobby'||V==='reveal'||V==='leaderboard')){lastQ=s.currentQ;go('question');return;}
    if(phase==='reveal'&&V==='question'){go('reveal');return;}
    if(phase==='leaderboard'&&V!=='leaderboard'&&V!=='finished'){go('leaderboard');return;}
    if(phase==='finished'&&V!=='finished'){go('finished');return;}
    // same phase but new question
    if(phase==='question'&&s.currentQ!==lastQ){lastQ=s.currentQ;go('question');return;}
  }
  // admin: refresh player count in lobby silently
  if(ROLE==='admin'&&V==='adminLobby'){
    const count=Object.keys(s.players||{}).length;
    const el=document.getElementById('player-count');
    const chips=document.getElementById('player-chips');
    if(el)el.textContent=count;
    if(chips)chips.innerHTML=count===0
      ?'<p style="font-size:13px;color:#bbb">No players yet — share the link!</p>'
      :renderChips(s.players);
    const startBtn=document.getElementById('start-btn');
    if(startBtn)startBtn.textContent=`▶  Start quiz${count>0?' ('+count+' player'+(count!==1?'s':')+')':''}`;
  }
  // update timer display
  if((V==='question'||V==='adminQuestion')&&s.timerStart){
    const elapsed=Math.floor((Date.now()-s.timerStart)/1000);
    timerVal=Math.max(0,Q_TIME-elapsed);
    const el=document.getElementById('timer-el');
    if(el){el.textContent=timerVal;el.className=`timer${timerVal<=5?' timer-danger':timerVal<=10?' timer-warn':''}`;}
    if(timerVal<=0&&ROLE==='admin'){adminReveal();}
    if(timerVal<=0&&ROLE==='player'&&V==='question'){go('reveal');}
  }
  // refresh LB rows live
  if(V==='adminLeaderboard'||V==='leaderboard'){renderLBRows(s.players);}
}

// ── local timer (admin only) ─────────────────────────────
function startLocalTimer(){
  clearInterval(timerInterval);
  timerVal=Q_TIME;
  timerInterval=setInterval(()=>{
    timerVal--;
    const el=document.getElementById('timer-el');
    if(el){el.textContent=timerVal;el.className=`timer${timerVal<=5?' timer-danger':timerVal<=10?' timer-warn':''}`;}
    // update answer count
    if(GS){
      const ac=Object.values(GS.players||{}).filter(p=>p.answers&&p.answers[GS.currentQ]!==undefined).length;
      const tot=Object.keys(GS.players||{}).length;
      const acEl=document.getElementById('ac');const rrEl=document.getElementById('rr');
      if(acEl)acEl.textContent=ac;
      if(rrEl)rrEl.textContent=(tot>0?Math.round(ac/tot*100):0)+'%';
    }
    if(timerVal<=0){clearInterval(timerInterval);adminReveal();}
  },1000);
}

// ═══════════════════════════════════════════════════════
//  VIEWS
// ═══════════════════════════════════════════════════════

function render(){
  ({
    landing:rLanding,setup:rSetup,adminPin:rAdminPin,qr:rQR,
    adminLobby:rAdminLobby,adminQuestion:rAdminQuestion,
    adminReveal:rAdminReveal,adminLeaderboard:rAdminLB,adminFinished:rAdminFinished,
    join:rJoin,lobby:rLobby,question:rQuestion,reveal:rReveal,
    leaderboard:rLB,finished:rFinished
  }[V]||rLanding)();
}

// ── LANDING ──────────────────────────────────────────────
function rLanding(){
  // Auto-route if URL has params
  if(BIN_ID&&ROLE==='player'){go('join');return;}
  if(BIN_ID&&!ROLE){go('adminPin');return;}

  set(`<div style="text-align:center;padding:2.5rem 1rem 2rem">
    <div style="font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px">ManageEngine PAM360</div>
    <h1 style="font-size:26px;font-weight:700;margin-bottom:6px">Build 8540 · Live Quiz</h1>
    <p style="font-size:14px;color:#666;margin-bottom:2rem">${QUESTIONS.length} questions &nbsp;·&nbsp; ${Q_TIME}s timer &nbsp;·&nbsp; live leaderboard</p>
    <div style="display:flex;flex-direction:column;gap:10px;max-width:270px;margin:0 auto">
      <button class="btn btn-blue" style="justify-content:center;padding:0.8rem;font-weight:600" onclick="go('adminPin')">&#9881;&nbsp; I am the Host</button>
      <button class="btn btn-green" style="justify-content:center;padding:0.8rem;font-size:15px;font-weight:600" onclick="go('join')">&#128100;&nbsp; Join as participant</button>
      <button class="btn" style="justify-content:center;padding:0.8rem" onclick="go('qr')">&#9638;&nbsp; Show QR code</button>
    </div>
    <p style="font-size:12px;color:#ccc;margin-top:1.75rem">Host PIN: <strong style="color:#999">1234</strong></p>
  </div>`);
}

// ── ADMIN PIN ────────────────────────────────────────────
function rAdminPin(){
  set(`<div style="max-width:340px;margin:2.5rem auto">
    <div class="card">
      <p style="font-size:16px;font-weight:700;margin-bottom:4px">Host access</p>
      <p style="font-size:13px;color:#888;margin-bottom:1rem">Enter the PIN to open the host panel.</p>
      <input type="text" id="pin" placeholder="Enter PIN" maxlength="8" style="margin-bottom:8px" />
      <div id="pin-err" style="font-size:12px;color:#dc2626;min-height:16px;margin-bottom:8px"></div>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="go('landing')">&#8592; Back</button>
        <button class="btn btn-blue" onclick="doPin()">Enter &rarr;</button>
      </div>
    </div>
  </div>`);
  const el=document.getElementById('pin');el.focus();
  el.addEventListener('keydown',e=>{if(e.key==='Enter')doPin();});
}
async function doPin(){
  if(document.getElementById('pin').value!==ADMIN_PIN){
    document.getElementById('pin-err').textContent='Incorrect PIN.';return;
  }
  ROLE='admin';
  // If no BIN_ID yet, create one
  if(!BIN_ID){
    document.getElementById('pin-err').style.color='#666';
    document.getElementById('pin-err').textContent='Setting up quiz room...';
    BIN_ID=await binCreate();
    if(!BIN_ID){document.getElementById('pin-err').style.color='#dc2626';document.getElementById('pin-err').textContent='Could not create quiz room. Check internet connection.';return;}
    // Update URL so QR code works
    const url=new URL(location.href);
    url.searchParams.set('bin',BIN_ID);
    history.replaceState({},'',url);
  }
  GS=await binRead(BIN_ID)||freshState();
  startPoll();
  go('adminLobby');
}

// ── QR PAGE ──────────────────────────────────────────────
function rQR(){
  const joinUrl=BIN_ID
    ? `${location.origin}${location.pathname}?bin=${BIN_ID}&role=player`
    : location.href;
  set(`<div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem">
      <button class="btn" onclick="go('landing')" style="padding:0.4rem 0.8rem">&#8592;</button>
      <h2 style="font-size:20px;font-weight:700">Join QR code</h2>
    </div>
    <div class="card" style="display:flex;gap:1.5rem;flex-wrap:wrap;align-items:flex-start">
      <div>
        <div style="background:#fff;padding:10px;border-radius:10px;border:1px solid #e0e0de;display:inline-block" id="qr-el"></div>
        <p style="font-size:11px;color:#aaa;text-align:center;margin-top:6px">Scan to join</p>
      </div>
      <div style="flex:1;min-width:180px">
        <p class="sec">Participant link</p>
        <input type="text" id="qr-url" value="${joinUrl}" style="font-size:12px;margin-bottom:8px" readonly />
        ${!BIN_ID?`<div class="notice notice-blue" style="margin-bottom:8px">&#8505; Open the Host panel first to generate the join link.</div>`:''}
        <div class="hr"></div>
        <p class="sec">How participants join</p>
        <p style="font-size:13px;color:#555;line-height:1.85">They scan the QR or open the link, enter their nickname and they appear in your lobby instantly.</p>
      </div>
    </div>
    <div style="margin-top:1rem;display:flex;gap:8px">
      <button class="btn btn-blue" onclick="go('adminPin')">&#9881; Host panel</button>
      <button class="btn btn-green" onclick="go('join')">&#128100; Join</button>
    </div>
  </div>`);
  setTimeout(()=>{
    const el=document.getElementById('qr-el');
    if(!el)return;
    try{new QRCode(el,{text:joinUrl,width:160,height:160,colorDark:'#111',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});}
    catch(e){el.textContent='Open host panel first to generate QR';}
  },80);
}

// ── ADMIN LOBBY ──────────────────────────────────────────
function rAdminLobby(){
  const players=GS?.players||{};
  const count=Object.keys(players).length;
  const joinUrl=`${location.origin}${location.pathname}?bin=${BIN_ID}&role=player`;
  set(`<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem">
      <div>
        <h2 style="font-size:20px;font-weight:700">Host panel</h2>
        <div style="margin-top:4px"><span class="badge-live">Lobby open</span></div>
      </div>
      <button class="btn" onclick="go('qr')" style="font-size:12px">&#9638; QR code</button>
    </div>

    <div class="notice notice-blue" style="margin-bottom:1rem;font-size:12px">
      &#128279; Share this link with participants:&nbsp;
      <strong style="word-break:break-all">${joinUrl}</strong>
    </div>

    <div class="card" style="margin-bottom:1rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <p class="sec" style="margin-bottom:0">Players joined (<span id="player-count">${count}</span>)</p>
        <button class="btn" onclick="adminAddDemo()" style="font-size:11px;padding:3px 8px">+ Demo</button>
      </div>
      <div id="player-chips" style="display:flex;flex-wrap:wrap;gap:4px;min-height:32px">
        ${count===0
          ? '<p style="font-size:13px;color:#bbb">No players yet — share the link above!</p>'
          : renderChips(players)}
      </div>
    </div>

function rJoin(){
  set(`<div style="max-width:380px;margin:2rem auto">

      ${!BIN_ID?`<div class="notice notice-red" style="margin-bottom:1rem">&#9888; No quiz room found. Ask your host for the correct link.</div>`:''}
      <input type="text" id="nick" placeholder="e.g. Alex_Dev" maxlength="20" style="margin-bottom:8px;font-size:16px;text-align:center" ${!BIN_ID?'disabled':''} />
      <div id="nick-err" style="font-size:12px;color:#dc2626;min-height:16px;text-align:center;margin-bottom:8px"></div>
      <button class="btn btn-green" onclick="doJoin()" style="width:100%;justify-content:center;padding:0.8rem;font-size:15px;font-weight:600" ${!BIN_ID?'disabled':''}>Join quiz &rarr;</button>
      <button class="btn" onclick="go('landing')" style="width:100%;justify-content:center;margin-top:8px">&#8592; Back</button>
    </div>
  </div>`);
  const el=document.getElementById('nick');
  if(el){el.focus();el.addEventListener('keydown',e=>{if(e.key==='Enter')doJoin();});}
}

async function doJoin(){
  const name=document.getElementById('nick').value.trim();
  const err=document.getElementById('nick-err');
  if(!name){err.textContent='Please enter a nickname.';return;}
  if(name.length<2){err.textContent='At least 2 characters.';return;}
  if(!BIN_ID){err.textContent='No quiz room. Get the link from your host.';return;}

  err.textContent='';
  const btn=document.querySelector('button.btn-green');
  if(btn){btn.disabled=true;btn.textContent='Joining...';}

  try{
    const s=await binRead(BIN_ID);
    if(!s){err.textContent='Could not connect to quiz room.';if(btn){btn.disabled=false;btn.textContent='Join quiz →';}return;}
    if(s.players[name]){err.textContent='Nickname already taken. Choose another.';if(btn){btn.disabled=false;btn.textContent='Join quiz →';}return;}
    s.players[name]={score:0,answers:{}};
    await binWrite(BIN_ID,s);
    GS=s;
    MY_NAME=name;
    MY_ANSWERS={};
    ROLE='player';
    startPoll();
    if(s.phase==='lobby')go('lobby');
    else if(s.phase==='question'){lastQ=s.currentQ;go('question');}
    else if(s.phase==='reveal')go('reveal');
    else if(s.phase==='finished')go('finished');
    else go('lobby');
  }catch(e){err.textContent='Connection error. Try again.';if(btn){btn.disabled=false;btn.textContent='Join quiz →';}}
}

// ── PARTICIPANT QUESTION ─────────────────────────────────
function rQuestion(){
  const s=GS||freshState();
  const q=QUESTIONS[s.currentQ];
  const picked=MY_ANSWERS[s.currentQ];
  const answered=picked!==undefined;
  const elapsed=s.timerStart?Math.floor((Date.now()-s.timerStart)/1000):0;
  timerVal=Math.max(0,Q_TIME-elapsed);
  set(`<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.85rem">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="tag tag-blue">${q.topic}</span>
        <span style="font-size:12px;color:#888">Q${s.currentQ+1}/${QUESTIONS.length}</span>
      </div>
      <div class="timer${timerVal<=5?' timer-danger':timerVal<=10?' timer-warn':''}" id="timer-el">${timerVal}</div>
    </div>
    <div class="prog-bg"><div class="prog-fill" style="width:${Math.round(s.currentQ/QUESTIONS.length*100)}%"></div></div>
    <p style="font-size:16px;font-weight:700;margin-bottom:1.1rem;line-height:1.55">${q.q}</p>
    ${q.opts.map((o,i)=>`
      <button class="opt${answered&&i===picked?' picked':''}" ${answered?'disabled':''} onclick="playerAnswer(${i},${s.currentQ})">
        <span style="font-weight:700;color:#bbb;margin-right:8px">${String.fromCharCode(65+i)}.</span>${o}
      </button>`).join('')}
    ${answered?`<div class="notice notice-green" style="margin-top:1rem;text-align:center">&#10003; Answer locked in — waiting for host to reveal</div>`:''}
  </div>`);
  // start participant timer display
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timerVal--;
    const el=document.getElementById('timer-el');
    if(el){el.textContent=timerVal;el.className=`timer${timerVal<=5?' timer-danger':timerVal<=10?' timer-warn':''}`;}
    if(timerVal<=0){clearInterval(timerInterval);if(V==='question')go('reveal');}
  },1000);
}

async function playerAnswer(choice,qIdx){
  if(MY_ANSWERS[qIdx]!==undefined)return;
  const s=GS||freshState();
  const q=QUESTIONS[qIdx];
  const elapsed=s.timerStart?Math.floor((Date.now()-s.timerStart)/1000):Q_TIME;
  const correct=choice===q.answer;
  const pts=correct?Math.max(50,Math.round(500-elapsed*42)):0;
  MY_ANSWERS[qIdx]=choice;
  if(s.players[MY_NAME]){
    s.players[MY_NAME].answers=s.players[MY_NAME].answers||{};
    s.players[MY_NAME].answers[qIdx]={choice,correct,pts,time:elapsed};
    s.players[MY_NAME].score=(s.players[MY_NAME].score||0)+pts;
    await binWrite(BIN_ID,s);
    GS=s;
  }
  render();
}
